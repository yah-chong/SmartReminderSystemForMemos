<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>長輩專用大字版語音備忘錄</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* 基礎字體放大與高對比設定 */
        body {
            font-size: 22px;
            background-color: #ffffff;
            color: #000000;
        }
        .large-btn {
            min-height: 64px;
            font-size: 22px;
            font-weight: bold;
            border: 3px solid #000000;
            border-radius: 12px;
        }
        .record-btn {
            min-height: 88px;
            font-size: 28px;
            font-weight: bold;
            border: 4px solid #000000;
            border-radius: 16px;
        }
        input, textarea, select {
            font-size: 22px !important;
            border: 3px solid #000000 !important;
            border-radius: 10px !important;
            padding: 12px !important;
        }
    </style>
</head>
<body class="bg-white text-black p-4 max-w-xl mx-auto">

    <!-- 頂部標題與字體縮放控制 -->
    <header class="flex justify-between items-center mb-4 pb-2 border-b-4 border-black">
        <h1 class="text-3xl font-black">📝 語音備忘錄</h1>
        <div class="flex gap-2">
            <button onclick="adjustFontSize(2)" class="bg-gray-200 border-2 border-black px-4 py-2 font-bold text-xl rounded-lg">➕ 放大</button>
            <button onclick="adjustFontSize(-2)" class="bg-gray-200 border-2 border-black px-4 py-2 font-bold text-xl rounded-lg">➖ 縮小</button>
        </div>
    </header>

    <!-- 單行屏幕狀態列：全部備忘、待提醒、已過期 -->
    <section class="grid grid-cols-3 gap-2 mb-6 text-center">
        <div class="bg-yellow-100 border-3 border-black p-3 rounded-xl font-bold">
            <div class="text-lg">全部備忘</div>
            <div id="stat-total" class="text-3xl">0</div>
        </div>
        <div class="bg-green-100 border-3 border-black p-3 rounded-xl font-bold">
            <div class="text-lg">待提醒</div>
            <div id="stat-pending" class="text-3xl">0</div>
        </div>
        <div class="bg-red-100 border-3 border-black p-3 rounded-xl font-bold">
            <div class="text-lg">已過期</div>
            <div id="stat-expired" class="text-3xl">0</div>
        </div>
    </section>

    <!-- 錄音與新增輸入區 -->
    <section class="mb-6 bg-gray-50 p-4 border-3 border-black rounded-2xl shadow-md">
        <button id="record-btn" onclick="toggleRecord()" class="record-btn w-full bg-red-500 text-white mb-4 flex items-center justify-center gap-3">
            🎤 <span>按下開始說話</span>
        </button>
        
        <div class="mb-4">
            <label class="block font-bold mb-2">備忘內容（可語音或打字）：</label>
            <textarea id="memo-input" rows="3" class="w-full" placeholder="點擊上方按鈕說話，或在此輸入內容..."></textarea>
        </div>

        <div class="mb-4">
            <label class="block font-bold mb-2">預定提醒時間（選填）：</label>
            <input type="datetime-local" id="memo-time" class="w-full">
        </div>

        <button onclick="saveMemo()" class="large-btn w-full bg-blue-600 text-white">
            💾 新增儲存備忘錄
        </button>
    </section>

    <hr class="border-t-4 border-black my-6">

    <!-- 備忘錄列表（緊逐條顯示） -->
    <section>
        <h2 class="text-2xl font-black mb-4">📋 您的備忘錄清單</h2>
        <div id="memo-list" class="space-y-4">
            <!-- 動態插入備忘錄卡片 -->
        </div>
    </section>

    <!-- 增修訂/編輯備忘錄與時間設定彈窗 -->
    <div id="edit-modal" class="fixed inset-0 bg-black bg-opacity-60 hidden flex items-center justify-center p-4 z-50">
        <div class="bg-white border-4 border-black p-6 rounded-2xl w-full max-w-md max-h-[90vh] overflow-y-auto">
            <h3 class="text-2xl font-black mb-4">✏️ 修改與設定備忘錄</h3>
            
            <div class="mb-4">
                <label class="block font-bold mb-2">修改備忘內容：</label>
                <textarea id="edit-memo-text" rows="4" class="w-full"></textarea>
            </div>

            <div class="mb-6">
                <label class="block font-bold mb-2">修改提醒時間：</label>
                <input type="datetime-local" id="edit-memo-time" class="w-full">
            </div>

            <div class="flex flex-col gap-3">
                <button onclick="confirmEditMemo()" class="large-btn bg-green-600 text-white">💾 保存修改內容</button>
                <button onclick="syncToGoogleCalendarModal()" class="large-btn bg-yellow-400 text-black border-2 border-black">📅 同步至 Google 日曆</button>
                <button onclick="closeEditModal()" class="large-btn bg-gray-300 text-black">❌ 取消</button>
            </div>
        </div>
    </div>

    <script>
        let memos = JSON.parse(localStorage.getItem('elder_memos') || '[]');
        let currentEditingId = null;
        let recognition = null;
        let isRecording = false;

        // 初始化語音辨識
        if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            recognition = new SpeechRecognition();
            recognition.lang = 'zh-TW';
            recognition.continuous = false;
            recognition.interimResults = true;

            recognition.onresult = (event) => {
                let transcript = '';
                for (let i = event.resultIndex; i < event.results.length; i++) {
                    transcript += event.results[i][0].transcript;
                }
                document.getElementById('memo-input').value = transcript;
            };

            recognition.onend = () => {
                isRecording = false;
                const btn = document.getElementById('record-btn');
                btn.innerHTML = '🎤 <span>按下開始說話</span>';
                btn.classList.remove('bg-yellow-400', 'animate-pulse');
                btn.classList.add('bg-red-500');
            };
        }

        function toggleRecord() {
            if (!recognition) {
                alert('您的瀏覽器不支援語音辨識，請直接打字。');
                return;
            }
            const btn = document.getElementById('record-btn');
            if (!isRecording) {
                recognition.start();
                isRecording = true;
                btn.innerHTML = '🔴 <span>正在聆聽中... (再按一次停止)</span>';
                btn.classList.remove('bg-red-500');
                btn.classList.add('bg-yellow-400', 'animate-pulse');
            } else {
                recognition.stop();
                isRecording = false;
            }
        }

        function saveMemo() {
            const text = document.getElementById('memo-input').value.trim();
            const time = document.getElementById('memo-time').value;

            if (!text) {
                alert('請先輸入或說出備忘內容！');
                return;
            }

            const newMemo = {
                id: Date.now(),
                text: text,
                time: time || null,
                created: new Date().toLocaleString('zh-TW', { hour12: false })
            };

            memos.unshift(newMemo);
            syncAndRender();

            document.getElementById('memo-input').value = '';
            document.getElementById('memo-time').value = '';
            alert('💾 備忘錄已成功儲存！');
        }

        // 開啟增修訂編輯彈窗
        function openEditModal(id) {
            currentEditingId = id;
            const memo = memos.find(m => m.id === id);
            if (!memo) return;

            document.getElementById('edit-memo-text').value = memo.text;
            document.getElementById('edit-memo-time').value = memo.time || '';
            document.getElementById('edit-modal').classList.remove('hidden');
        }

        function closeEditModal() {
            document.getElementById('edit-modal').classList.add('hidden');
            currentEditingId = null;
        }

        // 確認並保存修改內容
        function confirmEditMemo() {
            const newText = document.getElementById('edit-memo-text').value.trim();
            const newTime = document.getElementById('edit-memo-time').value;

            if (!newText) {
                alert('備忘內容不能為空！');
                return;
            }

            const memo = memos.find(m => m.id === currentEditingId);
            if (memo) {
                memo.text = newText;
                memo.time = newTime || null;
                syncAndRender();
                closeEditModal();
                alert('✅ 修改完成並已成功儲存！');
            }
        }

        // 同步至 Google 日曆
        function syncToGoogleCalendarModal() {
            const newText = document.getElementById('edit-memo-text').value.trim();
            const newTime = document.getElementById('edit-memo-time').value;

            if (!newTime) {
                alert('請先設定提醒時間才能同步至 Google 日曆！');
                return;
            }

            const title = encodeURIComponent(newText);
            const dt = newTime.replace(/[-:]/g, '');
            const gCalUrl = `https://calendar.google.com/calendar/render?action=TEMPLATE&text=${title}&dates=${dt}/${dt}`;
            window.open(gCalUrl, '_blank');
        }

        // 刪除二次確認功能
        function deleteMemo(id) {
            if (confirm('⚠️ 請問您確定要刪除這筆備忘錄嗎？刪除後無法復原。')) {
                memos = memos.filter(m => m.id !== id);
                syncAndRender();
            }
        }

        function syncAndRender() {
            localStorage.setItem('elder_memos', JSON.stringify(memos));
            renderMemos();
            updateStats();
        }

        function updateStats() {
            const total = memos.length;
            const now = new Date();
            let pending = 0;
            let expired = 0;

            memos.forEach(m => {
                if (!m.time) return;
                const memoTime = new Date(m.time);
                if (memoTime > now) {
                    pending++;
                } else {
                    expired++;
                }
            });

            document.getElementById('stat-total').innerText = total;
            document.getElementById('stat-pending').innerText = pending;
            document.getElementById('stat-expired').innerText = expired;
        }

        function renderMemos() {
            const listEl = document.getElementById('memo-list');
            if (memos.length === 0) {
                listEl.innerHTML = '<div class="text-center p-6 bg-gray-50 border-2 border-black rounded-xl font-bold">目前沒有任何備忘錄</div>';
                return;
            }

            const now = new Date();
            listEl.innerHTML = memos.map(m => {
                let timeBadge = '';
                if (m.time) {
                    const isExp = new Date(m.time) <= now;
                    timeBadge = `<div class="mt-2 text-lg font-bold ${isExp ? 'text-red-600' : 'text-blue-700'}">⏰ 提醒時間：${m.time.replace('T', ' ')} ${isExp ? '(已過期)' : ''}</div>`;
                }

                return `
                    <div class="bg-yellow-50 border-3 border-black p-4 rounded-2xl shadow-sm">
                        <div class="text-2xl font-bold mb-2">${escapeHtml(m.text)}</div>
                        <div class="text-sm text-gray-600 mb-2">建立/更新：${m.created}</div>
                        ${timeBadge}
                        <div class="flex gap-3 mt-4">
                            <button onclick="openEditModal(${m.id})" class="large-btn flex-1 bg-yellow-400 text-black border-2 border-black">
                                ✏️ 增修 / 提醒
                            </button>
                            <button onclick="deleteMemo(${m.id})" class="large-btn flex-1 bg-red-600 text-white border-2 border-black">
                                🗑️ 刪除
                            </button>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function adjustFontSize(change) {
            const currentSize = parseFloat(window.getComputedStyle(document.body).fontSize);
            const newSize = currentSize + change;
            if (newSize >= 18 && newSize <= 36) {
                document.body.style.fontSize = newSize + 'px';
            }
        }

        function escapeHtml(str) {
            return str.replace(/[&<>'"]/g, 
                tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag)
            );
        }

        // 初始化載入
        renderMemos();
        updateStats();
    </script>
</body>
</html>
