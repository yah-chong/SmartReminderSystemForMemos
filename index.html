<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>語音備忘錄</title>
    <!-- 設定 iPhone 桌面 App 圖示（可替換為您的圖片） -->
    <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/3209/3209265.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            font-size: 22px;
            background-color: #f8fafc;
            color: #0f172a;
        }
        /* 精緻立體大按鈕樣式 */
        .large-btn {
            min-height: 64px;
            font-size: 22px;
            font-weight: bold;
            border-radius: 16px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            transition: transform 0.1s;
        }
        .large-btn:active {
            transform: scale(0.98);
        }
        .record-btn {
            min-height: 88px;
            font-size: 26px;
            font-weight: bold;
            border-radius: 20px;
            box-shadow: 0 10px 15px -3px rgba(239, 68, 68, 0.3);
        }
        input, textarea {
            font-size: 22px !important;
            border: 2px solid #cbd5e1 !important;
            border-radius: 14px !important;
            padding: 14px !important;
            background-color: #ffffff;
        }
        input:focus, textarea:focus {
            border-color: #2563eb !important;
            outline: none;
        }
    </style>
</head>
<body class="p-4 max-w-xl mx-auto">

    <!-- 頂部標題與字體縮放控制 -->
    <header class="flex justify-between items-center mb-6 pb-3 border-b-2 border-slate-200">
        <h1 class="text-3xl font-black text-slate-800 flex items-center gap-2">📝 語音備忘錄</h1>
        <div class="flex gap-2">
            <button onclick="adjustFontSize(2)" class="bg-white border-2 border-slate-300 px-3 py-1 font-bold text-lg rounded-xl shadow-sm">➕ 放大</button>
            <button onclick="adjustFontSize(-2)" class="bg-white border-2 border-slate-300 px-3 py-1 font-bold text-lg rounded-xl shadow-sm">➖ 縮小</button>
        </div>
    </header>

    <!-- 狀態統計列 -->
    <section class="grid grid-cols-3 gap-3 mb-6 text-center">
        <div class="bg-amber-50 border-2 border-amber-200 p-3 rounded-2xl shadow-sm font-bold">
            <div class="text-base text-amber-800">全部備忘</div>
            <div id="stat-total" class="text-3xl text-amber-900">0</div>
        </div>
        <div class="bg-emerald-50 border-2 border-emerald-200 p-3 rounded-2xl shadow-sm font-bold">
            <div class="text-base text-emerald-800">待提醒</div>
            <div id="stat-pending" class="text-3xl text-emerald-900">0</div>
        </div>
        <div class="bg-rose-50 border-2 border-rose-200 p-3 rounded-2xl shadow-sm font-bold">
            <div class="text-base text-rose-800">已過期</div>
            <div id="stat-expired" class="text-3xl text-rose-900">0</div>
        </div>
    </section>

    <!-- 錄音與新增輸入區 -->
    <section class="mb-6 bg-white p-5 border-2 border-slate-200 rounded-3xl shadow-lg">
        <button id="record-btn" onclick="toggleRecord()" class="record-btn w-full bg-rose-500 hover:bg-rose-600 text-white mb-5 flex items-center justify-center gap-3">
            🎤 <span>按下開始說話</span>
        </button>
        
        <div class="mb-4">
            <label class="block font-bold mb-2 text-slate-700">備忘內容（可語音或打字）：</label>
            <textarea id="memo-input" rows="3" class="w-full" placeholder="點擊上方按鈕說話，或在此輸入內容..."></textarea>
        </div>

        <div class="mb-5">
            <label class="block font-bold mb-2 text-slate-700">預定提醒時間（選填）：</label>
            <input type="datetime-local" id="memo-time" class="w-full">
        </div>

        <button onclick="saveMemo()" class="large-btn w-full bg-blue-600 hover:bg-blue-700 text-white">
            💾 新增儲存備忘錄
        </button>
    </section>

    <hr class="border-t-2 border-slate-200 my-6">

    <!-- 備忘錄列表 -->
    <section>
        <h2 class="text-2xl font-black mb-4 text-slate-800">📋 您的備忘錄清單</h2>
        <div id="memo-list" class="space-y-4"></div>
    </section>

    <!-- 編輯彈窗 -->
    <div id="edit-modal" class="fixed inset-0 bg-slate-900 bg-opacity-50 hidden flex items-center justify-center p-4 z-50 backdrop-blur-sm">
        <div class="bg-white border-2 border-slate-200 p-6 rounded-3xl w-full max-w-md shadow-2xl">
            <h3 class="text-2xl font-black mb-4 text-slate-800">✏️ 修改與設定備忘錄</h3>
            
            <div class="mb-4">
                <label class="block font-bold mb-2 text-slate-700">修改備忘內容：</label>
                <textarea id="edit-memo-text" rows="4" class="w-full"></textarea>
            </div>

            <div class="mb-6">
                <label class="block font-bold mb-2 text-slate-700">修改提醒時間：</label>
                <input type="datetime-local" id="edit-memo-time" class="w-full">
            </div>

            <div class="flex flex-col gap-3">
                <button onclick="confirmEditMemo()" class="large-btn bg-emerald-600 hover:bg-emerald-700 text-white">💾 保存修改內容</button>
                <button onclick="syncToGoogleCalendarModal()" class="large-btn bg-amber-400 hover:bg-amber-500 text-slate-900">📅 同步至 Google 日曆</button>
                <button onclick="closeEditModal()" class="large-btn bg-slate-200 hover:bg-slate-300 text-slate-800">❌ 取消</button>
            </div>
        </div>
    </div>

    <script>
        let memos = JSON.parse(localStorage.getItem('elder_memos') || '[]');
        let currentEditingId = null;
        let recognition = null;
        let isRecording = false;

        if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            recognition = new SpeechRecognition();
            recognition.lang = 'zh-TW';
            recognition.continuous = false;
            recognition.interimResults = true;

            recognition.onresult = (event) => {
                let transcript = '';
                for (let i = event.resultIndex; i < event.results.length; i++) {
                    transcript += event.results[i][0].transcript;
                }
                document.getElementById('memo-input').value = transcript;
            };

            recognition.onend = () => {
                isRecording = false;
                const btn = document.getElementById('record-btn');
                btn.innerHTML = '🎤 <span>按下開始說話</span>';
                btn.classList.remove('bg-amber-400', 'animate-pulse');
                btn.classList.add('bg-rose-500');
            };
        }

        function toggleRecord() {
            if (!recognition) {
                alert('您的瀏覽器不支援語音辨識，請直接打字。');
                return;
            }
            const btn = document.getElementById('record-btn');
            if (!isRecording) {
                recognition.start();
                isRecording = true;
                btn.innerHTML = '🔴 <span>正在聆聽中... (再按一次停止)</span>';
                btn.classList.remove('bg-rose-500');
                btn.classList.add('bg-amber-400', 'animate-pulse');
            } else {
                recognition.stop();
                isRecording = false;
            }
        }

        function saveMemo() {
            const text = document.getElementById('memo-input').value.trim();
            const time = document.getElementById('memo-time').value;

            if (!text) {
                alert('請先輸入或說出備忘內容！');
                return;
            }

            const newMemo = {
                id: Date.now(),
                text: text,
                time: time || null,
                created: new Date().toLocaleString('zh-TW', { hour12: false })
            };

            memos.unshift(newMemo);
            syncAndRender();

            document.getElementById('memo-input').value = '';
            document.getElementById('memo-time').value = '';
            alert('💾 備忘錄已成功儲存！');
        }

        function openEditModal(id) {
            currentEditingId = id;
            const memo = memos.find(m => m.id === id);
            if (!memo) return;

            document.getElementById('edit-memo-text').value = memo.text;
            document.getElementById('edit-memo-time').value = memo.time || '';
            document.getElementById('edit-modal').classList.remove('hidden');
        }

        function closeEditModal() {
            document.getElementById('edit-modal').classList.add('hidden');
            currentEditingId = null;
        }

        function confirmEditMemo() {
            const newText = document.getElementById('edit-memo-text').value.trim();
            const newTime = document.getElementById('edit-memo-time').value;

            if (!newText) {
                alert('備忘內容不能為空！');
                return;
            }

            const memo = memos.find(m => m.id === currentEditingId);
            if (memo) {
                memo.text = newText;
                memo.time = newTime || null;
                syncAndRender();
                closeEditModal();
                alert('✅ 修改完成並已成功儲存！');
            }
        }

        function syncToGoogleCalendarModal() {
            const newText = document.getElementById('edit-memo-text').value.trim();
            const newTime = document.getElementById('edit-memo-time').value;

            if (!newTime) {
                alert('請先設定提醒時間才能同步至 Google 日曆！');
                return;
            }

            const title = encodeURIComponent(newText);
            const dt = newTime.replace(/[-:]/g, '');
            const gCalUrl = `https://calendar.google.com/calendar/render?action=TEMPLATE&text=${title}&dates=${dt}/${dt}`;
            window.open(gCalUrl, '_blank');
        }

        function deleteMemo(id) {
            if (confirm('⚠️ 請問您確定要刪除這筆備忘錄嗎？刪除後無法復原。')) {
                memos = memos.filter(m => m.id !== id);
                syncAndRender();
            }
        }

        function syncAndRender() {
            localStorage.setItem('elder_memos', JSON.stringify(memos));
            renderMemos();
            updateStats();
        }

        function updateStats() {
            const total = memos.length;
            const now = new Date();
            let pending = 0;
            let expired = 0;

            memos.forEach(m => {
                if (!m.time) return;
                const memoTime = new Date(m.time);
                if (memoTime > now) {
                    pending++;
                } else {
                    expired++;
                }
            });

            document.getElementById('stat-total').innerText = total;
            document.getElementById('stat-pending').innerText = pending;
            document.getElementById('stat-expired').innerText = expired;
        }

        function renderMemos() {
            const listEl = document.getElementById('memo-list');
            if (memos.length === 0) {
                listEl.innerHTML = '<div class="text-center p-6 bg-white border-2 border-slate-200 rounded-2xl font-bold text-slate-400">目前沒有任何備忘錄</div>';
                return;
            }

            const now = new Date();
            listEl.innerHTML = memos.map(m => {
                let timeBadge = '';
                if (m.time) {
                    const isExp = new Date(m.time) <= now;
                    timeBadge = `<div class="mt-2 text-lg font-bold ${isExp ? 'text-rose-600' : 'text-blue-600'}">⏰ 提醒時間：${m.time.replace('T', ' ')} ${isExp ? '(已過期)' : ''}</div>`;
                }

                return `
                    <div class="bg-amber-50/60 border-2 border-amber-200 p-4 rounded-2xl shadow-sm">
                        <div class="text-2xl font-bold mb-2 text-slate-900">${escapeHtml(m.text)}</div>
                        <div class="text-sm text-slate-500 mb-2">建立/更新：${m.created}</div>
                        ${timeBadge}
                        <div class="flex gap-3 mt-4">
                            <button onclick="openEditModal(${m.id})" class="large-btn flex-1 bg-amber-400 hover:bg-amber-500 text-slate-900">
                                ✏️ 增修 / 提醒
                            </button>
                            <button onclick="deleteMemo(${m.id})" class="large-btn flex-1 bg-rose-600 hover:bg-rose-700 text-white">
                                🗑️ 刪除
                            </button>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function adjustFontSize(change) {
            const currentSize = parseFloat(window.getComputedStyle(document.body).fontSize);
            const newSize = currentSize + change;
            if (newSize >= 18 && newSize <= 36) {
                document.body.style.fontSize = newSize + 'px';
            }
        }

        function escapeHtml(str) {
            return str.replace(/[&<>'"]/g, 
                tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag)
            );
        }

        renderMemos();
        updateStats();
    </script>
</body>
</html>
