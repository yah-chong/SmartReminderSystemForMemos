<!DOCTYPE html>
<html lang="zh-TW" class="font-sans">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
    <title>大字版語音備忘錄與智慧提醒</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome 圖標庫 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        highContrastYellow: '#FFEB3B',
                        highContrastBlue: '#004085',
                        elderlyDark: '#111827',
                    }
                }
            }
        }
    </script>

    <style>
        /* 基礎大字體（適用老花眼） */
        html {
            font-size: 19px; /* 基礎字級提升 */
        }

        /* 錄音閃爍脈衝動畫 */
        @keyframes big-pulse {
            0% { transform: scale(1); box-shadow: 0 0 0 0 rgba(220, 38, 38, 0.8); }
            50% { transform: scale(1.04); box-shadow: 0 0 0 20px rgba(220, 38, 38, 0); }
            100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(220, 38, 38, 0); }
        }
        .recording-active {
            animation: big-pulse 1.3s infinite;
        }

        /* 加強表單控制項的高對比與點擊熱區 */
        input, textarea, select, button {
            font-size: 1rem !important;
        }

        /* 自訂大滾動條 */
        ::-webkit-scrollbar {
            width: 12px;
        }
        ::-webkit-scrollbar-track {
            background: #e2e8f0;
        }
        ::-webkit-scrollbar-thumb {
            background: #475569;
            border-radius: 6px;
        }
    </style>
</head>
<body class="bg-amber-50/40 text-slate-900 min-h-screen pb-16 antialiased selection:bg-yellow-300 selection:text-black">

    <!-- 頂部導覽列：包含極大標題與字體放大切換 -->
    <header class="bg-black text-white border-b-4 border-yellow-400 sticky top-0 z-40 shadow-lg px-4 py-3">
        <div class="max-w-4xl mx-auto flex flex-wrap items-center justify-between gap-3">
            <div class="flex items-center gap-3">
                <div class="w-12 h-12 bg-yellow-400 text-black rounded-2xl flex items-center justify-center font-black text-2xl border-2 border-white">
                    <i class="fa-solid fa-microphone text-2xl"></i>
                </div>
                <div>
                    <h1 class="font-extrabold text-2xl sm:text-3xl tracking-wide text-yellow-400">大字語音備忘錄</h1>
                    <p class="text-xs sm:text-sm font-bold text-slate-200">聽、說、記 一鍵搞定</p>
                </div>
            </div>

            <!-- 右側功能鈕：字體放大控制與通知設定 -->
            <div class="flex items-center gap-2">
                <!-- 字體放大/縮小控制 -->
                <div class="flex items-center bg-slate-800 rounded-xl p-1 border-2 border-slate-600">
                    <button onclick="changeFontSize(-1)" class="w-11 h-11 bg-slate-700 hover:bg-slate-600 active:bg-yellow-400 active:text-black rounded-lg text-white font-black text-xl flex items-center justify-center border border-slate-500" title="縮小字體">
                        A-
                    </button>
                    <span id="fontSizeDisplay" class="px-2 text-sm font-bold text-yellow-400">標準</span>
                    <button onclick="changeFontSize(1)" class="w-11 h-11 bg-slate-700 hover:bg-slate-600 active:bg-yellow-400 active:text-black rounded-lg text-white font-black text-xl flex items-center justify-center border border-slate-500" title="放大字體">
                        A+
                    </button>
                </div>

                <!-- 系統通知開關 -->
                <button id="notificationPermissionBtn" onclick="requestNotificationPermission()" class="h-11 px-3 bg-yellow-400 hover:bg-yellow-300 text-black font-black text-sm rounded-xl border-2 border-black flex items-center gap-1.5 shadow">
                    <i class="fa-solid fa-bell text-lg"></i>
                    <span id="notificationStatusText" class="hidden sm:inline">開啟提醒通知</span>
                </button>
            </div>
        </div>
    </header>

    <main class="max-w-4xl mx-auto px-3 sm:px-6 mt-5 space-y-6">

        <!-- 儀表板統計資訊 (高對比大卡片) -->
        <div class="grid grid-cols-2 sm:grid-cols-3 gap-3">
            <div class="bg-white p-3 sm:p-4 rounded-2xl border-3 border-black shadow-[4px_4px_0px_0px_rgba(0,0,0,1)] flex items-center gap-3">
                <div class="w-12 h-12 bg-blue-100 text-blue-900 rounded-xl flex items-center justify-center border-2 border-black text-xl">
                    <i class="fa-solid fa-list-check"></i>
                </div>
                <div>
                    <div class="text-2xl font-black text-black" id="statTotal">0</div>
                    <div class="text-xs sm:text-sm font-bold text-slate-700">全部備忘</div>
                </div>
            </div>

            <div class="bg-yellow-200 p-3 sm:p-4 rounded-2xl border-3 border-black shadow-[4px_4px_0px_0px_rgba(0,0,0,1)] flex items-center gap-3">
                <div class="w-12 h-12 bg-black text-yellow-300 rounded-xl flex items-center justify-center border-2 border-black text-xl">
                    <i class="fa-solid fa-clock"></i>
                </div>
                <div>
                    <div class="text-2xl font-black text-black" id="statActiveReminders">0</div>
                    <div class="text-xs sm:text-sm font-bold text-slate-900">待提醒事項</div>
                </div>
            </div>

            <div class="col-span-2 sm:col-span-1 bg-rose-100 p-3 sm:p-4 rounded-2xl border-3 border-black shadow-[4px_4px_0px_0px_rgba(0,0,0,1)] flex items-center gap-3">
                <div class="w-12 h-12 bg-rose-600 text-white rounded-xl flex items-center justify-center border-2 border-black text-xl">
                    <i class="fa-solid fa-triangle-exclamation"></i>
                </div>
                <div>
                    <div class="text-2xl font-black text-rose-950" id="statOverdue">0</div>
                    <div class="text-xs sm:text-sm font-bold text-rose-900">已過期提醒</div>
                </div>
            </div>
        </div>

        <!-- 核心區域 1：語音錄音與輸入區 -->
        <section class="bg-white rounded-3xl p-5 sm:p-7 border-4 border-black shadow-[6px_6px_0px_0px_rgba(0,0,0,1)] space-y-5">
            
            <div class="flex items-center justify-between border-b-4 border-black pb-3">
                <h2 class="text-xl sm:text-2xl font-black text-black flex items-center gap-2">
                    <i class="fa-solid fa-pen-to-square text-blue-700"></i> 新增備忘 / 會議
                </h2>
                <span id="speechSupportBadge" class="text-xs sm:text-sm px-3 py-1 bg-emerald-300 text-black font-black border-2 border-black rounded-full hidden">
                    支援語音輸入
                </span>
            </div>

            <!-- 不支援語音警示 -->
            <div id="speechUnsupportedAlert" class="hidden p-4 bg-amber-200 border-3 border-black rounded-2xl text-sm font-bold text-black flex items-center gap-2">
                <i class="fa-solid fa-triangle-exclamation text-xl text-red-600"></i>
                <span>您的瀏覽器未開啓語音功能，但您仍可點擊下方直接用打字輸入。</span>
            </div>

            <!-- 超大錄音按鈕 (高對比紅/藍切換) -->
            <div class="bg-amber-100/60 p-5 rounded-2xl border-3 border-black flex flex-col items-center justify-center text-center space-y-3">
                <button id="toggleRecordBtn" onclick="toggleRecording()" class="w-full max-w-sm h-20 sm:h-24 bg-red-600 hover:bg-red-700 active:scale-95 text-white font-black text-xl sm:text-2xl rounded-2xl border-4 border-black shadow-[4px_4px_0px_0px_rgba(0,0,0,1)] flex items-center justify-center gap-3 transition">
                    <i id="recordIcon" class="fa-solid fa-microphone text-3xl sm:text-4xl"></i>
                    <span id="recordBtnText">按下開始說話錄音</span>
                </button>
                <div id="recordStatus" class="text-base sm:text-lg font-black text-slate-800">
                    點擊紅色大按鈕後即可開始說話
                </div>
                <div id="liveStatusIndicator" class="hidden items-center gap-2 text-red-700 font-black text-lg">
                    <span class="w-4 h-4 rounded-full bg-red-600 animate-ping"></span>
                    <span>正在聆聽中...請大聲說話</span>
                </div>
            </div>

            <!-- 輸入表單區 -->
            <div class="space-y-4">
                <div>
                    <label for="memoTitle" class="block font-black text-black text-base sm:text-lg mb-1">
                        1. 備忘標題 / 會議名稱：
                    </label>
                    <input type="text" id="memoTitle" placeholder="例如：明天早上吃藥、下午開會..." class="w-full px-4 py-3.5 bg-white border-3 border-black rounded-xl font-bold text-black focus:outline-none focus:ring-4 focus:ring-yellow-400 placeholder:text-slate-400">
                </div>

                <div>
                    <label for="memoContent" class="block font-black text-black text-base sm:text-lg mb-1">
                        2. 詳細內容 (說話文字會自動填入這裡)：
                    </label>
                    <textarea id="memoContent" rows="3" placeholder="語音轉出來的文字會顯示在這裡，也可以手動修改..." class="w-full px-4 py-3.5 bg-white border-3 border-black rounded-xl font-bold text-black focus:outline-none focus:ring-4 focus:ring-yellow-400 placeholder:text-slate-400 resize-y"></textarea>
                </div>

                <div>
                    <label for="memoDatetime" class="block font-black text-black text-base sm:text-lg mb-1">
                        3. 提醒或會議日期時間 (選填)：
                    </label>
                    <input type="datetime-local" id="memoDatetime" class="w-full px-4 py-3.5 bg-white border-3 border-black rounded-xl font-bold text-black focus:outline-none focus:ring-4 focus:ring-yellow-400 min-h-[55px]">
                </div>

                <div class="pt-2 flex flex-col sm:flex-row gap-3">
                    <button onclick="saveMemo()" class="flex-1 h-16 bg-blue-700 hover:bg-blue-800 active:scale-95 text-white font-black text-xl rounded-2xl border-3 border-black shadow-[4px_4px_0px_0px_rgba(0,0,0,1)] flex items-center justify-center gap-2 transition">
                        <i class="fa-solid fa-floppy-disk text-2xl"></i>
                        <span>儲存備忘錄</span>
                    </button>
                    <button onclick="clearForm()" class="h-16 px-6 bg-slate-200 hover:bg-slate-300 text-black font-black text-lg rounded-2xl border-3 border-black transition">
                        重填
                    </button>
                </div>
            </div>
        </section>

        <!-- 核心區域 2：備忘錄清單與搜尋 -->
        <section class="space-y-4">
            
            <!-- 搜尋與篩選 (大按鈕風格) -->
            <div class="bg-white p-4 rounded-2xl border-3 border-black shadow-[4px_4px_0px_0px_rgba(0,0,0,1)] space-y-3">
                <div class="relative">
                    <input type="text" id="searchInput" oninput="renderMemos()" placeholder="搜尋備忘錄關鍵字..." class="w-full pl-12 pr-4 py-3 bg-slate-100 border-3 border-black rounded-xl font-bold text-black focus:outline-none focus:ring-4 focus:ring-yellow-400">
                    <i class="fa-solid fa-magnifying-glass absolute left-4 top-1/2 -translate-y-1/2 text-black text-xl"></i>
                </div>

                <div class="flex flex-wrap items-center justify-between gap-2">
                    <select id="statusFilter" onchange="renderMemos()" class="px-3 py-2.5 bg-yellow-300 border-3 border-black rounded-xl font-black text-black focus:outline-none text-base">
                        <option value="all">顯示全部</option>
                        <option value="pending">待提醒</option>
                        <option value="overdue">已過期</option>
                        <option value="none">無提醒日期</option>
                    </select>

                    <button onclick="clearAllMemos()" class="px-4 py-2 bg-rose-200 hover:bg-rose-300 text-rose-950 font-black text-sm rounded-xl border-2 border-black transition">
                        <i class="fa-solid fa-trash-can mr-1"></i>清空全部
                    </button>
                </div>
            </div>

            <!-- 備忘錄列表容器 -->
            <div id="memoList" class="space-y-4">
                <!-- 由 JavaScript 動態繪製 -->
            </div>

        </section>

    </main>

    <!-- 編輯 Modal (超大字體視窗) -->
    <div id="editModal" class="fixed inset-0 bg-black/80 backdrop-blur-xs z-50 hidden items-center justify-center p-3">
        <div class="bg-white rounded-3xl max-w-xl w-full p-6 border-4 border-black shadow-2xl space-y-4 max-h-[90vh] overflow-y-auto">
            <div class="flex justify-between items-center border-b-4 border-black pb-3">
                <h3 class="font-black text-black text-2xl">修改備忘錄</h3>
                <button onclick="closeEditModal()" class="w-12 h-12 bg-slate-200 hover:bg-slate-300 rounded-xl border-2 border-black font-black text-2xl text-black flex items-center justify-center">
                    ✕
                </button>
            </div>
            <input type="hidden" id="editMemoId">
            <div class="space-y-3">
                <div>
                    <label for="editMemoTitle" class="block font-black text-black mb-1">標題：</label>
                    <input type="text" id="editMemoTitle" class="w-full px-4 py-3 bg-white border-3 border-black rounded-xl font-bold text-black">
                </div>
                <div>
                    <label for="editMemoContent" class="block font-black text-black mb-1">詳細內容：</label>
                    <textarea id="editMemoContent" rows="4" class="w-full px-4 py-3 bg-white border-3 border-black rounded-xl font-bold text-black"></textarea>
                </div>
                <div>
                    <label for="editMemoDatetime" class="block font-black text-black mb-1">提醒日期時間：</label>
                    <input type="datetime-local" id="editMemoDatetime" class="w-full px-4 py-3 bg-white border-3 border-black rounded-xl font-bold text-black min-h-[50px]">
                </div>
            </div>
            <div class="flex gap-3 pt-3">
                <button onclick="closeEditModal()" class="flex-1 h-14 bg-slate-200 text-black font-black text-lg rounded-xl border-3 border-black">取消</button>
                <button onclick="saveEditModal()" class="flex-1 h-14 bg-blue-700 text-white font-black text-lg rounded-xl border-3 border-black">儲存修改</button>
            </div>
        </div>
    </div>

    <!-- 底部超大提示框 (Toast Notification) -->
    <div id="toast" class="fixed bottom-6 left-1/2 -translate-x-1/2 bg-black text-white px-6 py-4 rounded-2xl border-4 border-yellow-400 shadow-2xl flex items-center gap-3 transform translate-y-32 opacity-0 transition-all duration-300 z-50 min-w-[280px] max-w-[90vw]">
        <i id="toastIcon" class="fa-solid fa-circle-info text-yellow-400 text-2xl"></i>
        <span id="toastMessage" class="text-base sm:text-lg font-black text-white">提示訊息</span>
    </div>

    <!-- JavaScript 邏輯程式碼 -->
    <script>
        // 全域變數
        let memos = JSON.parse(localStorage.getItem('voice_memos_elderly')) || [];
        let recognition = null;
        let isRecording = false;
        let currentFontLevel = 0; // 0: 標準, 1: 大, 2: 特大
        const fontLevelNames = ["標準", "大字", "特大"];
        const fontBaseSizes = ["19px", "22px", "25px"];

        // 初始化
        window.onload = function() {
            initSpeechRecognition();
            renderMemos();
            startReminderChecker();
            checkNotificationStatus();
        };

        // 0. 字體放大/縮小控制
        function changeFontSize(delta) {
            currentFontLevel += delta;
            if (currentFontLevel < 0) currentFontLevel = 0;
            if (currentFontLevel > 2) currentFontLevel = 2;

            document.documentElement.style.fontSize = fontBaseSizes[currentFontLevel];
            document.getElementById('fontSizeDisplay').innerText = fontLevelNames[currentFontLevel];
            showToast(`已調整字體為：${fontLevelNames[currentFontLevel]}`, 'info');
        }

        // 1. Web Speech API 語音轉文字
        function initSpeechRecognition() {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            const supportBadge = document.getElementById('speechSupportBadge');
            const alertBox = document.getElementById('speechUnsupportedAlert');

            if (SpeechRecognition) {
                recognition = new SpeechRecognition();
                recognition.continuous = true;
                recognition.interimResults = true;
                recognition.lang = 'zh-TW';

                supportBadge.classList.remove('hidden');

                recognition.onresult = function(event) {
                    let transcript = '';
                    for (let i = event.resultIndex; i < event.results.length; i++) {
                        transcript += event.results[i][0].transcript;
                    }
                    const contentArea = document.getElementById('memoContent');
                    contentArea.value = transcript;
                };

                recognition.onerror = function(event) {
                    console.error('語音辨識錯誤:', event.error);
                    stopRecording();
                    showToast('語音辨識失敗，請再試一次', 'error');
                };

                recognition.onend = function() {
                    if (isRecording) {
                        try {
                            recognition.start();
                        } catch(e) {
                            stopRecording();
                        }
                    }
                };
            } else {
                alertBox.classList.remove('hidden');
            }
        }

        function toggleRecording() {
            if (!recognition) {
                showToast('您的裝置不支援語音辨識', 'error');
                return;
            }

            if (isRecording) {
                stopRecording();
            } else {
                startRecording();
            }
        }

        function startRecording() {
            try {
                recognition.start();
                isRecording = true;
                const btn = document.getElementById('toggleRecordBtn');
                const icon = document.getElementById('recordIcon');
                const btnText = document.getElementById('recordBtnText');
                const status = document.getElementById('recordStatus');
                const indicator = document.getElementById('liveStatusIndicator');

                btn.classList.remove('bg-red-600', 'hover:bg-red-700');
                btn.classList.add('bg-black', 'text-yellow-400', 'recording-active');
                icon.className = 'fa-solid fa-square text-3xl sm:text-4xl text-yellow-400';
                btnText.innerText = '停止說話錄音';
                status.innerText = '正在錄音...講完請點上方按鈕停止';
                indicator.classList.remove('hidden');
                indicator.classList.add('flex');
            } catch(e) {
                console.error(e);
            }
        }

        function stopRecording() {
            if (recognition) {
                recognition.stop();
            }
            isRecording = false;
            const btn = document.getElementById('toggleRecordBtn');
            const icon = document.getElementById('recordIcon');
            const btnText = document.getElementById('recordBtnText');
            const status = document.getElementById('recordStatus');
            const indicator = document.getElementById('liveStatusIndicator');

            btn.classList.add('bg-red-600', 'hover:bg-red-700');
            btn.classList.remove('bg-black', 'text-yellow-400', 'recording-active');
            icon.className = 'fa-solid fa-microphone text-3xl sm:text-4xl text-white';
            btnText.innerText = '按下開始說話錄音';
            status.innerText = '錄音結束，內容已自動填入下方';
            indicator.classList.add('hidden');
            indicator.classList.remove('flex');
        }

        // 2. 備忘錄新增與管理
        function saveMemo() {
            const titleInput = document.getElementById('memoTitle');
            const contentInput = document.getElementById('memoContent');
            const datetimeInput = document.getElementById('memoDatetime');

            const title = titleInput.value.trim();
            const content = contentInput.value.trim();
            const datetime = datetimeInput.value;

            if (!title && !content) {
                showToast('請先輸入標題或用語音說話！', 'error');
                return;
            }

            if (isRecording) stopRecording();

            const newMemo = {
                id: Date.now().toString(),
                title: title || '無標題備忘',
                content: content,
                datetime: datetime || null,
                createdAt: new Date().toISOString(),
                triggered: false
            };

            memos.unshift(newMemo);
            saveToLocalStorage();
            renderMemos();
            clearForm();
            showToast('已成功儲存備忘錄！', 'success');
        }

        function deleteMemo(id) {
            if (confirm('確定要刪除這條備忘錄嗎？')) {
                memos = memos.filter(m => m.id !== id);
                saveToLocalStorage();
                renderMemos();
                showToast('已刪除備忘錄', 'info');
            }
        }

        function clearAllMemos() {
            if (memos.length === 0) return;
            if (confirm('⚠️ 警告：確定要清空所有的備忘錄嗎？清空後無法復原！')) {
                memos = [];
                saveToLocalStorage();
                renderMemos();
                showToast('已清空所有備忘錄', 'info');
            }
        }

        function clearForm() {
            document.getElementById('memoTitle').value = '';
            document.getElementById('memoContent').value = '';
            document.getElementById('memoDatetime').value = '';
        }

        function saveToLocalStorage() {
            localStorage.setItem('voice_memos_elderly', JSON.stringify(memos));
        }

        // 3. 一鍵朗讀功能 (Text-to-Speech)
        function readAloud(text) {
            if (!('speechSynthesis' in window)) {
                showToast('您的裝置不支援文字朗讀', 'error');
                return;
            }

            // 先停止發聲中的語音
            window.speechSynthesis.cancel();

            if (!text) return;

            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'zh-TW';
            utterance.rate = 0.85; // 稍微放慢語速，方便長輩聽清

            window.speechSynthesis.speak(utterance);
            showToast('🔊 開始為您朗讀...', 'info');
        }

        // 4. 畫面渲染
        function renderMemos() {
            const listContainer = document.getElementById('memoList');
            const searchKeyword = document.getElementById('searchInput').value.toLowerCase();
            const filterValue = document.getElementById('statusFilter').value;
            const now = new Date();

            let activeCount = 0;
            let overdueCount = 0;

            memos.forEach(m => {
                if (m.datetime) {
                    const memoDate = new Date(m.datetime);
                    if (memoDate < now && !m.triggered) {
                        overdueCount++;
                    } else if (memoDate >= now) {
                        activeCount++;
                    }
                }
            });

            document.getElementById('statTotal').innerText = memos.length;
            document.getElementById('statActiveReminders').innerText = activeCount;
            document.getElementById('statOverdue').innerText = overdueCount;

            let filtered = memos.filter(m => {
                const matchSearch = m.title.toLowerCase().includes(searchKeyword) || 
                                    m.content.toLowerCase().includes(searchKeyword);
                if (!matchSearch) return false;

                if (filterValue === 'all') return true;
                if (filterValue === 'none') return !m.datetime;
                
                if (m.datetime) {
                    const mDate = new Date(m.datetime);
                    if (filterValue === 'pending') return mDate >= now;
                    if (filterValue === 'overdue') return mDate < now;
                }
                return false;
            });

            if (filtered.length === 0) {
                listContainer.innerHTML = `
                    <div class="bg-white rounded-3xl p-8 text-center border-4 border-black">
                        <i class="fa-solid fa-folder-open text-4xl text-slate-400 mb-2"></i>
                        <p class="text-xl font-black text-slate-700">目前沒有相關的備忘錄</p>
                    </div>
                `;
                return;
            }

            listContainer.innerHTML = filtered.map(memo => {
                let statusBadge = '';
                let datetimeText = '未設定提醒時間';
                
                if (memo.datetime) {
                    const mDate = new Date(memo.datetime);
                    datetimeText = formatDatetime(memo.datetime);
                    
                    if (mDate < now) {
                        statusBadge = `<span class="px-3 py-1 rounded-xl text-sm font-black bg-rose-600 text-white border-2 border-black">已過期</span>`;
                    } else {
                        statusBadge = `<span class="px-3 py-1 rounded-xl text-sm font-black bg-yellow-300 text-black border-2 border-black">待提醒</span>`;
                    }
                } else {
                    statusBadge = `<span class="px-3 py-1 rounded-xl text-sm font-black bg-slate-200 text-black border-2 border-black">一般事項</span>`;
                }

                const gCalUrl = generateGoogleCalendarUrl(memo);
                const textToRead = `${memo.title}。${memo.content}`;

                return `
                    <div class="bg-white rounded-3xl p-5 border-4 border-black shadow-[6px_6px_0px_0px_rgba(0,0,0,1)] space-y-4">
                        
                        <div class="flex flex-wrap items-start justify-between gap-2 border-b-3 border-slate-200 pb-3">
                            <h3 class="font-black text-black text-xl sm:text-2xl leading-snug break-all">${escapeHtml(memo.title)}</h3>
                            <div>${statusBadge}</div>
                        </div>

                        ${memo.content ? `
                            <div class="bg-amber-50/70 p-4 rounded-2xl border-2 border-black">
                                <p class="text-lg font-bold text-black leading-relaxed whitespace-pre-wrap break-all">${escapeHtml(memo.content)}</p>
                            </div>
                        ` : ''}

                        <!-- 時間顯示區 -->
                        <div class="flex items-center gap-2 text-base font-black text-slate-800">
                            <i class="fa-regular fa-clock text-xl text-blue-700"></i>
                            <span>${datetimeText}</span>
                        </div>

                        <!-- 超大按鈕操作列 -->
                        <div class="grid grid-cols-2 sm:grid-cols-4 gap-2 pt-2">
                            <!-- 一鍵朗讀按鈕 -->
                            <button onclick="readAloud('${escapeJsString(textToRead)}')" class="h-14 bg-emerald-300 hover:bg-emerald-400 text-black font-black text-base rounded-2xl border-3 border-black flex items-center justify-center gap-1.5 active:scale-95 transition">
                                <i class="fa-solid fa-volume-high text-xl"></i>
                                <span>朗讀</span>
                            </button>

                            <!-- Google Calendar 按鈕 -->
                            ${memo.datetime ? `
                                <a href="${gCalUrl}" target="_blank" class="h-14 bg-blue-100 hover:bg-blue-200 text-black font-black text-base rounded-2xl border-3 border-black flex items-center justify-center gap-1.5 active:scale-95 transition">
                                    <i class="fa-brands fa-google text-xl text-blue-700"></i>
                                    <span>加日曆</span>
                                </a>
                            ` : `
                                <button disabled class="h-14 bg-slate-100 text-slate-400 font-bold text-base rounded-2xl border-2 border-slate-300 flex items-center justify-center gap-1 cursor-not-allowed">
                                    <i class="fa-brands fa-google text-xl"></i>
                                    <span>無時間</span>
                                </button>
                            `}

                            <!-- 編輯按鈕 -->
                            <button onclick="openEditModal('${memo.id}')" class="h-14 bg-amber-200 hover:bg-amber-300 text-black font-black text-base rounded-2xl border-3 border-black flex items-center justify-center gap-1.5 active:scale-95 transition">
                                <i class="fa-solid fa-pen text-xl"></i>
                                <span>修改</span>
                            </button>

                            <!-- 刪除按鈕 -->
                            <button onclick="deleteMemo('${memo.id}')" class="h-14 bg-rose-600 hover:bg-rose-700 text-white font-black text-base rounded-2xl border-3 border-black flex items-center justify-center gap-1.5 active:scale-95 transition">
                                <i class="fa-solid fa-trash-can text-xl"></i>
                                <span>刪除</span>
                            </button>
                        </div>

                    </div>
                `;
            }).join('');
        }

        // 5. Google 日曆連結生成
        function generateGoogleCalendarUrl(memo) {
            const title = encodeURIComponent(memo.title || '備忘錄提醒');
            const details = encodeURIComponent(memo.content || '');
            
            let dateParam = '';
            if (memo.datetime) {
                const startDate = new Date(memo.datetime);
                const endDate = new Date(startDate.getTime() + 30 * 60 * 1000);
                
                const startIso = startDate.toISOString().replace(/-|:|\.\d\d\d/g, "");
                const endIso = endDate.toISOString().replace(/-|:|\.\d\d\d/g, "");
                dateParam = `&dates=${startIso}/${endIso}`;
            }

            return `https://calendar.google.com/calendar/render?action=TEMPLATE&text=${title}&details=${details}${dateParam}`;
        }

        // 6. 智慧提醒與通知
        function startReminderChecker() {
            setInterval(() => {
                const now = new Date();
                memos.forEach(memo => {
                    if (memo.datetime && !memo.triggered) {
                        const reminderTime = new Date(memo.datetime);
                        if (now >= reminderTime && (now - reminderTime) < 60000) {
                            triggerNotification(memo);
                            memo.triggered = true;
                            saveToLocalStorage();
                            renderMemos();
                        }
                    }
                });
            }, 10000);
        }

        function triggerNotification(memo) {
            playChimeSound();
            readAloud(`提醒時間到。${memo.title}`);

            if ('Notification' in window && Notification.permission === 'granted') {
                new Notification(`⏰ 備忘提醒：${memo.title}`, {
                    body: memo.content || '您預訂的時間到了！',
                    icon: 'https://cdn-icons-png.flaticon.com/512/3602/3602145.png'
                });
            }

            showToast(`⏰ 時間到：${memo.title}`, 'warning');
        }

        function requestNotificationPermission() {
            if (!('Notification' in window)) {
                showToast('您的裝置不支援桌面通知', 'error');
                return;
            }

            Notification.requestPermission().then(permission => {
                checkNotificationStatus();
                if (permission === 'granted') {
                    showToast('已成功開啟提醒通知功能！', 'success');
                } else {
                    showToast('通知功能未開啟', 'error');
                }
            });
        }

        function checkNotificationStatus() {
            const statusText = document.getElementById('notificationStatusText');
            if ('Notification' in window) {
                if (Notification.permission === 'granted') {
                    statusText.innerText = '通知已開啟';
                } else {
                    statusText.innerText = '開啟提醒通知';
                }
            }
        }

        function playChimeSound() {
            try {
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                if (!AudioContext) return;
                const ctx = new AudioContext();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                
                osc.type = 'sine';
                osc.frequency.setValueAtTime(523.25, ctx.currentTime); // C5
                osc.frequency.setValueAtTime(659.25, ctx.currentTime + 0.2); // E5
                osc.frequency.setValueAtTime(783.99, ctx.currentTime + 0.4); // G5
                
                gain.gain.setValueAtTime(0.5, ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 1.2);
                
                osc.connect(gain);
                gain.connect(ctx.destination);
                osc.start();
                osc.stop(ctx.currentTime + 1.2);
            } catch(e) {
                console.log('Audio Context error:', e);
            }
        }

        // 7. 編輯視窗控制
        function openEditModal(id) {
            const memo = memos.find(m => m.id === id);
            if (!memo) return;

            document.getElementById('editMemoId').value = memo.id;
            document.getElementById('editMemoTitle').value = memo.title;
            document.getElementById('editMemoContent').value = memo.content || '';
            document.getElementById('editMemoDatetime').value = memo.datetime || '';

            const modal = document.getElementById('editModal');
            modal.classList.remove('hidden');
            modal.classList.add('flex');
        }

        function closeEditModal() {
            const modal = document.getElementById('editModal');
            modal.classList.add('hidden');
            modal.classList.remove('flex');
        }

        function saveEditModal() {
            const id = document.getElementById('editMemoId').value;
            const memo = memos.find(m => m.id === id);

            if (memo) {
                memo.title = document.getElementById('editMemoTitle').value.trim() || '無標題備忘';
                memo.content = document.getElementById('editMemoContent').value.trim();
                const newDatetime = document.getElementById('editMemoDatetime').value;
                
                if (memo.datetime !== newDatetime) {
                    memo.datetime = newDatetime || null;
                    memo.triggered = false;
                }

                saveToLocalStorage();
                renderMemos();
                closeEditModal();
                showToast('已修改備忘內容！', 'success');
            }
        }

        // 輔助函式
        function showToast(msg, type = 'success') {
            const toast = document.getElementById('toast');
            const toastMsg = document.getElementById('toastMessage');
            const toastIcon = document.getElementById('toastIcon');

            toastMsg.innerText = msg;

            if (type === 'success') {
                toastIcon.className = 'fa-solid fa-circle-check text-emerald-400 text-2xl';
            } else if (type === 'error') {
                toastIcon.className = 'fa-solid fa-circle-xmark text-rose-400 text-2xl';
            } else if (type === 'warning') {
                toastIcon.className = 'fa-solid fa-bell text-yellow-300 text-2xl';
            } else {
                toastIcon.className = 'fa-solid fa-circle-info text-blue-400 text-2xl';
            }

            toast.classList.remove('translate-y-32', 'opacity-0');
            toast.classList.add('translate-y-0', 'opacity-100');

            setTimeout(() => {
                toast.classList.remove('translate-y-0', 'opacity-100');
                toast.classList.add('translate-y-32', 'opacity-0');
            }, 3500);
        }

        function formatDatetime(dtStr) {
            if (!dtStr) return '';
            const dt = new Date(dtStr);
            const year = dt.getFullYear();
            const month = String(dt.getMonth() + 1).padStart(2, '0');
            const date = String(dt.getDate()).padStart(2, '0');
            const hours = String(dt.getHours()).padStart(2, '0');
            const mins = String(dt.getMinutes()).padStart(2, '0');
            return `${year}年${month}月${date}日 ${hours}:${mins}`;
        }

        function escapeHtml(str) {
            if (!str) return '';
            return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
        }

        function escapeJsString(str) {
            if (!str) return '';
            return str.replace(/\\/g, '\\\\').replace(/'/g, "\\'").replace(/"/g, '\\"').replace(/\n/g, ' ');
        }
    </script>
</body>
</html>
